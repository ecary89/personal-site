  if (!j || !j.out){ toast('Nothing left to add. Try moving the slider to Less.'); return; }
  let src = j.out.toDataURL('image/webp', .9);
  if (!src.startsWith('data:image/webp')) src = j.out.toDataURL('image/png');
  const id = j.existingId || 'u_' + uid();
  const prev = USER.get(id) || {};
  USER.set(id, { ...prev, ...pickMeta(j.meta), id, src, w:j.out.width, h:j.out.height, cut:true, source:prev.source || j.meta.source || 'upload' });
  const ratio = j.out.height / j.out.width;
  if (j.meta.shared){ // came from the phone's Share menu: save it, then show "Saved"
    track('share_saved', { mode:j.mode });
    scheduleSave(); closeSheet();
    if (queue.length) toast('Saved. Here\'s the next one.'); else { savedId = id; openView('saved'); }
    return;
  }
  closeSheet();
  addItem({ type:'photo', value:id, size:clamp(Math.round(30 / Math.max(1, ratio * .8)), 12, 40) });
  scheduleSave();
}
const pickMeta = m => ({ name:m.name || null, brand:m.brand || null, price:m.price || null, url:m.url || null });

// Uploads, pastes and drops all come through here
function openFile(file){

// Keep the picture's layout size fixed and only scale it, so scrolling stays smooth:
// the box sticks with just its bottom strip showing, and the picture shrinks to fit that strip.
function shrinkPhoto(sc){
  const stick = sc.querySelector('.photo-stick'); if (!stick) return;
  const scale = stick.firstElementChild;
  if (isDesk()){ stick.style.top = ''; scale.style.transform = ''; stick.classList.remove('stuck'); return; }
  const H = stick.offsetHeight, small = Math.min(H, Math.max(140, H * .4));
  const shown = Math.max(small, H - sc.scrollTop);
  stick.style.top = (small - H) + 'px';
  scale.style.transform = shown >= H ? '' : `scale(${(shown / H).toFixed(4)})`;
  stick.classList.toggle('stuck', shown <= small + 1);
}

function closeReader(){ reader.hidden = true; renderAll(); $('#readBtn').focus({ preventScroll:true }); }

// Swipe left or right on phones. Touch events keep reporting even after the page

  let start = null;

    const t = e.touches[0]; start = { x:t.clientX, y:t.clientY, at:Date.now() };
  }, { passive:true });

/* =========================================================
   Keyboard (desktop)
   ========================================================= */
addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]');
  const mod = e.metaKey || e.ctrlKey;
  // keep Tab inside an open dialog or the reader
  const trapIn = sheetKind ? sheet : !reader.hidden ? reader : null;
  if (e.key === 'Tab' && trapIn){
    const f = [...trapIn.querySelectorAll('button:not(:disabled), a[href], input, textarea, [tabindex="0"]')].filter(x => x.offsetParent !== null);
    if (f.length){
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === -1 || i === f.length - 1)){ e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (!reader.hidden && !sheetKind){
    if (e.key === 'ArrowRight') turn(1);
    if (e.key === 'ArrowLeft') turn(-1);
    if (e.key === 'Escape') closeReader();
    return;
  }
  if (e.key === 'Escape'){ if (sheetKind) closeSheet(); else select(null); return; }
  if (!reader.hidden) return;
  if (mod && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); return; }
  if (typing || sheetKind) return;
  const it = selItem(); if (!it) return;
  const find = id => itemActions(it).find(a => a.id === id);
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); doAction(find('remove')); return; }
  if (mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); doAction(find('copy')); return; }
  if (e.key === ']'){ const a = find('forward'); if (!a.disabled) doAction(a); return; }
  if (e.key === '['){ const a = find('back'); if (!a.disabled) doAction(a); return; }
  if (!mod && ['=', '+', '-', ',', '.'].includes(e.key)){
    e.preventDefault();
    const [lo, hi] = SIZE[it.type];
    if (e.key === ',' || e.key === '.') it.rot = snapRot(it.rot + (e.key === ',' ? -5 : 5));
    else it.size = clamp(it.size * (e.key === '-' ? .94 : 1.06), lo, hi);
    place(els.get(it.id), it); positionItemBar(); clearTimeout(wheelTimer); wheelTimer = setTimeout(commit, 400);
    return;
  }
  const step = e.shiftKey ? 3 : .6, dir = { ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1] }[e.key];
  if (dir){ e.preventDefault(); it.x += dir[0] * step; it.y += dir[1] * step; place(els.get(it.id), it); positionItemBar(); positionHandle(); clearTimeout(wheelTimer); wheelTimer = setTimeout(commit, 400); }
});


/* =========================================================
   Tweak mode: tap any part of the app, nudge its spacing, colors,
   size or position, then copy the changes to paste back to Claude.
   Changes are previewed live and remembered in this browser.
   ========================================================= */
const tweak = { on:false, picking:true, el:null, sel:null, rules:{}, history:[] };
try { tweak.rules = JSON.parse(localStorage.getItem('scrapbook-tweaks') || '{}') || {}; } catch (e){ tweak.rules = {}; }
const twStyle = document.createElement('style'); twStyle.id = 'tweakStyles'; document.head.append(twStyle);
const twHover = el('div', 'tw-box hover'), twSelBox = el('div', 'tw-box');
twHover.hidden = twSelBox.hidden = true; twSelBox.append(el('span'));
const twPanel = el('div', 'tw-panel'); twPanel.hidden = true; twPanel.setAttribute('role', 'dialog'); twPanel.setAttribute('aria-label', 'Tweak the design');
document.body.append(twHover, twSelBox, twPanel);
const TW_SKIP = /^(sel|new|on|open|flipped|drag-src|stuck|dragging|gone|items|sheet-open|tw-.*)$/;
function twSelector(e){
  if (e.id) return '#' + e.id;
  const cls = [...e.classList].filter(c => !TW_SKIP.test(c));
  const tag = e.tagName.toLowerCase();
  if (cls.length) return (['div', 'span', 'section'].includes(tag) ? '' : tag) + '.' + cls.join('.');
  const par = e.parentElement;

}
const twPx = v => Math.round(parseFloat(v) || 0);
function twHex(c){
  const m = (c || '').match(/rgba?\(([^)]+)\)/); if (!m) return null;
  const [r, g, b, a] = m[1].split(',').map(x => parseFloat(x));
  if (a === 0) return null;
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function twApply(){
  twStyle.textContent = Object.entries(tweak.rules).filter(([, p]) => Object.keys(p).length)
    .map(([sel, p]) => `${sel}{ ${Object.entries(p).map(([k, v]) => `${k}:${v} !important;`).join(' ')} }`).join('\n');
  try { localStorage.setItem('scrapbook-tweaks', JSON.stringify(tweak.rules)); } catch (e){}
  twPlace(twSelBox, tweak.el); positionItemBar && positionItemBar();
}
function twSet(prop, val){
  const sel = tweak.sel; if (!sel) return;
  const r = tweak.rules[sel] || (tweak.rules[sel] = {});
  tweak.history.push({ sel, prop, prev:r[prop] });
  if (val == null) delete r[prop]; else r[prop] = val;
  twApply(); twRender();
}
function twPlace(box, e){
  if (!e || !document.contains(e)){ box.hidden = true; return; }
  const r = e.getBoundingClientRect();
  Object.assign(box.style, { left:r.left - 2 + 'px', top:r.top - 2 + 'px', width:r.width + 4 + 'px', height:r.height + 4 + 'px' });
  box.hidden = false;
}
function twPick(e){
  tweak.el = e; tweak.sel = twSelector(e);
  twSelBox.firstChild.textContent = tweak.sel;
  twPlace(twSelBox, e); twRender();
}
function twStepper(label, prop, get, unit = 'px', step = 1){
  const row = el('div', 'tw-row'); row.append(el('label', null, label));
  const box = el('div', 'tw-step');

}
function twColor(label, prop, current){
  const row = el('div', 'tw-row'); row.append(el('label', null, label));
  const box = el('div', 'tw-color');
  const inp = el('input'); inp.type = 'color'; inp.value = current || '#ffffff'; inp.setAttribute('aria-label', label);

function twRender(){
  twPanel.innerHTML = '';
  const top = el('div', 'tw-top'); top.append(el('b', null, 'Tweak mode'));
  const pick = el('button', 'tw-pick', tweak.picking ? 'Picking' : 'Pick'); pick.setAttribute('aria-pressed', String(tweak.picking));
  pick.title = 'When on, taps pick a part to tweak. Turn off to use the app normally (open a panel, then pick again).';

  const done = el('button', null, 'Done'); done.onclick = () => twToggle(false);
  const side = el('button', null, isDesk() ? '⇆' : '⇅'); side.title = 'Move this panel out of the way'; side.setAttribute('aria-label', 'Move this panel');
  side.onclick = () => twPanel.classList.toggle(isDesk() ? 'right' : 'top');

  const e = tweak.el;
  if (!e || !document.contains(e)){
    twPanel.append(el('p', 'tw-empty', tweak.picking ? 'Tap any part of the app to tweak it. Turn off Picking to use the app normally, for example to open a panel.' : 'Picking is off, so the app works normally. Turn it on to choose something.'));
  } else {
    const cs = getComputedStyle(e), r = tweak.rules[tweak.sel] || {};

    hide.onclick = () => { twSet('display', r.display === 'none' ? null : 'none'); if (r.display !== 'none'){ twSelBox.hidden = true; } };
    tgt.append(hide);
    twPanel.append(tgt);
    const g = el('div', 'tw-grid');
    const tr = (r.translate || '0px 0px').split(' ').map(twPx);
    const moveRow = (label, axis) => {
      const row = el('div', 'tw-row'); row.append(el('label', null, label)); const box = el('div', 'tw-step');
      const v = tr[axis] || 0, minus = el('button', null, axis ? '↑' : '←'), plus = el('button', null, axis ? '↓' : '→'), inp = el('input'); inp.value = v;
      const set = n => { const t = [...tr]; t[axis] = n; twSet('translate', t[0] || t[1] ? `${t[0] || 0}px ${t[1] || 0}px` : null); };

    g.append(el('div', 'tw-sec', 'Space inside'),
      twStepper('Top', 'padding-top', () => twPx(cs.paddingTop)), twStepper('Bottom', 'padding-bottom', () => twPx(cs.paddingBottom)),
      twStepper('Left', 'padding-left', () => twPx(cs.paddingLeft)), twStepper('Right', 'padding-right', () => twPx(cs.paddingRight)));

    if (/flex|grid/.test(cs.display)) g.append(twStepper('Gap', 'gap', () => twPx(cs.rowGap || cs.gap)));
    g.append(el('div', 'tw-sec', 'Look'),
      twColor('Background', 'background', twHex(cs.backgroundColor)), twColor('Text', 'color', twHex(cs.color)),

function twToggle(on){

const twInside = t => t && t.closest && (t.closest('.tw-panel') || t.closest('.toast'));
['pointerdown', 'mousedown', 'click', 'dblclick', 'touchstart'].forEach(type => addEventListener(type, ev => {
