<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Erika Cary — Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <style>html { background: #F9F4F6; }</style>
    <link rel="stylesheet" href="/work/work.css">
</head>
<body class="lock-body">
<!-- The /work gate. One password field; the password decides which page opens.
     Locked pages live at /work/<page>/ as encrypted payloads (see scripts/lock.js). -->

<div class="lock-curtain" id="lock-curtain" hidden aria-hidden="true"></div>
<p class="lock-status visually-hidden" id="lock-status" hidden role="status" aria-live="polite">Opening…</p>

<div class="lock" id="lock" hidden>
    <a class="lock-home" href="/">Erika Cary</a>
    <h1 class="lock-title">Enter password to view selected work.</h1>
    <form class="lock-form" id="lock-form" autocomplete="off" novalidate>
        <label class="visually-hidden" for="lock-input">Password</label>
        <input class="lock-input" id="lock-input" type="password" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" required>
        <button class="btn btn-primary" id="lock-submit" type="submit">Open</button>
    </form>
    <p class="lock-error" id="lock-error" role="alert" aria-live="polite"></p>
    <p class="lock-contact">Need a password? <br>Email <a href="mailto:erika.mi.cary@gmail.com">erika.mi.cary@gmail.com</a>
        <button class="lock-copy" id="lock-copy" type="button" data-email="erika.mi.cary@gmail.com" aria-label="Copy email address">Copy</button>
    </p>
</div>

<noscript><p class="lock-status">This page needs JavaScript to open.</p></noscript>

<script src="/cursor.js"></script>
<script src="/work/locked.js"></script>
<script>ECLock.init({ mode: 'gate' });</script>
</body>
</html>
